# Render blueprint for the API. The frontend is deployed separately (Vercel).
services:
  - type: web
    name: route53-clone-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Allow the deployed frontend (any *.vercel.app URL) to call the API.
      - key: ROUTE53_CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
