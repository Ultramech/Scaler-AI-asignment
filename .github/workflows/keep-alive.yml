# Render's free tier puts the API to sleep after ~15 minutes without traffic, which also resets its SQLite file.
# Pinging /health every 5 minutes keeps the demo awake (and its data intact) between visits.
# GitHub runs scheduled workflows on a best-effort basis and may skip runs, so the app also wakes the API itself
# (see wakeApi in frontend/app/lib/api.ts) when someone opens it.
name: Keep demo API awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API health endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 90 https://route53-clone-api-s69g.onrender.com/health
